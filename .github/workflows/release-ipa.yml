name: Build and release IPA

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Build IPA
        run: |
          set -euo pipefail
          build_output="$(xtool dev build --configuration release --ipa)"
          printf '%s\n' "$build_output"
          ipa_path="$(printf '%s\n' "$build_output" | sed -n 's/^Wrote to //p' | tail -n 1)"
          if [ -z "$ipa_path" ] || [ ! -f "$ipa_path" ]; then
            echo "::error::xtool did not produce an IPA"
            exit 1
          fi
          cp "$ipa_path" studybudy.ipa

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" studybudy.ipa \
            --title "Study Budy $GITHUB_REF_NAME" \
            --generate-notes
